name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# softprops/action-gh-release 需要写权限把安装包挂到 tag 对应的 Release 上。
permissions:
  contents: write

# 同一个 ref 重复触发（删 tag 重打）时不并发跑两份打包，避免产物互相覆盖。
concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # 生产身份出包：productName 为 Zodex，产物文件名不带 _TEST 后缀。
      ZCODE_ENV: production
      # 安装包运行时从 GitHub Releases 拉取 remote 资产，打包阶段不需要准备 mock-cdn 远程资源。
      ZCODE_SKIP_REMOTE_ASSETS: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # CI 里不需要安装 git hooks，跳过 husky 的 prepare 脚本。
          HUSKY: "0"

      - name: Build Windows x64 installer
        run: pnpm bundle:desktop -- --os win --arch x64 --skip-prepare
        env:
          # GitHub runner 访问官方 electron-builder-binaries 更稳定；
          # 404 时 bundle.mjs 会自动切回 npmmirror，无需在这里做 fallback。
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
        # 本地推送前验证：pnpm smoke:windows-bundle 在 Docker 中复刻本步骤（scripts/smoke-windows-bundle.mjs）。

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          # P5：latest.yml + .exe.blockmap 与安装包同属 electron-updater feed，
          # 一并上传 artifact 便于核对（安装包 glob 保持 error-on-missing）。
          path: |
            packages/desktop/dist/Zodex-*-win-x64.exe
            packages/desktop/dist/latest.yml
            packages/desktop/dist/*.exe.blockmap
          if-no-files-found: error

      # workflow_dispatch（无 tag）调试运行只出 artifact，不碰 Release。
      - name: Attach installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # P5：electron-updater github provider 依赖同 Release 上的 latest.yml +
          # blockmap（差分下载）；softprops 是唯一上传通道（bundle.mjs --publish never）。
          files: |
            packages/desktop/dist/Zodex-*-win-x64.exe
            packages/desktop/dist/latest.yml
            packages/desktop/dist/*.exe.blockmap
          fail_on_unmatched_files: true
          generate_release_notes: true
          # 阶段测试版（v3.14.3-alpha.N）标记为 pre-release，正式版（v3.14.3）不受影响。
          prerelease: ${{ contains(github.ref_name, '-') }}

  # D8：Linux 发布产物。ZCODE_LINUX_CI_TARGETS 限制 electron-builder 只打
  # AppImage + deb（rpm/pacman 仍是本地构建可选项，见 electron-builder.config.js）。
  build-linux-x64:
    name: Build Linux x64 packages
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ZCODE_ENV: production
      ZCODE_SKIP_REMOTE_ASSETS: "1"
      ZCODE_LINUX_CI_TARGETS: "AppImage,deb"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"

      - name: Build Linux x64 packages
        run: pnpm bundle:desktop -- --os linux --arch x64 --skip-prepare
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

      - name: Upload Linux packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x64
          # Zodex-*-linux-* 同时覆盖 AppImage/deb 与 .AppImage.blockmap；
          # latest-linux.yml 与它们同属 electron-updater feed（安装包 glob 保持 error-on-missing）。
          path: |
            packages/desktop/dist/Zodex-*-linux-*
            packages/desktop/dist/latest-linux.yml
          if-no-files-found: error

      # workflow_dispatch（无 tag）调试运行只出 artifact，不碰 Release。
      - name: Attach Linux packages to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/desktop/dist/Zodex-*-linux-x86_64.AppImage
            packages/desktop/dist/Zodex-*-linux-x86_64.AppImage.blockmap
            packages/desktop/dist/Zodex-*-linux-amd64.deb
            packages/desktop/dist/latest-linux.yml
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # D8：macOS 双架构出包（约 10× runner 成本，仅 tag 推送或手动触发）。
  # 未签名：CSC_IDENTITY_AUTO_DISCOVERY=false，notarize:false 由 eb 配置默认关闭。
  build-macos-arm64:
    name: Build macOS arm64 installer
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    timeout-minutes: 120
    env:
      ZCODE_ENV: production
      ZCODE_SKIP_REMOTE_ASSETS: "1"
      # CI 无签名身份，禁止 electron-builder 自动发现本地证书（避免隐式半签名产物）。
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"

      - name: Build macOS arm64 installer
        run: pnpm bundle:desktop -- --os mac --arch arm64 --skip-prepare
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

      # 两个 arch 各写一份同名 latest-mac.yml（直接上传会互相覆盖），复制进按 arch
      # 命名的子目录，供 release-macos-channel 合并时区分。
      - name: Stage update feed under arch directory
        run: |
          mkdir -p packages/desktop/dist/latest-mac-arm64
          cp packages/desktop/dist/latest-mac.yml packages/desktop/dist/latest-mac-arm64/latest-mac.yml

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: |
            packages/desktop/dist/Zodex-*-mac-arm64.dmg
            packages/desktop/dist/Zodex-*-mac-arm64.dmg.blockmap
            packages/desktop/dist/Zodex-*-mac-arm64.zip
            packages/desktop/dist/Zodex-*-mac-arm64.zip.blockmap
            packages/desktop/dist/latest-mac-arm64/latest-mac.yml
          if-no-files-found: error

  build-macos-x64:
    name: Build macOS x64 installer
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      ZCODE_ENV: production
      ZCODE_SKIP_REMOTE_ASSETS: "1"
      # CI 无签名身份，禁止 electron-builder 自动发现本地证书（避免隐式半签名产物）。
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"

      - name: Build macOS x64 installer
        run: pnpm bundle:desktop -- --os mac --arch x64 --skip-prepare
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

      # 两个 arch 各写一份同名 latest-mac.yml（直接上传会互相覆盖），复制进按 arch
      # 命名的子目录，供 release-macos-channel 合并时区分。
      - name: Stage update feed under arch directory
        run: |
          mkdir -p packages/desktop/dist/latest-mac-x64
          cp packages/desktop/dist/latest-mac.yml packages/desktop/dist/latest-mac-x64/latest-mac.yml

      - name: Upload macOS x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-x64
          path: |
            packages/desktop/dist/Zodex-*-mac-x64.dmg
            packages/desktop/dist/Zodex-*-mac-x64.dmg.blockmap
            packages/desktop/dist/Zodex-*-mac-x64.zip
            packages/desktop/dist/Zodex-*-mac-x64.zip.blockmap
            packages/desktop/dist/latest-mac-x64/latest-mac.yml
          if-no-files-found: error

  # D8：合并双 arch 的 latest-mac.yml。electron-updater 6.8.3 从合并后的 files[]
  # URL（-arm64/-x64 后缀）选择对应架构条目，无需服务器端改写。
  release-macos-channel:
    name: Release macOS update channel
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: [build-macos-arm64, build-macos-x64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos-arm64
          path: dist/arm64

      - name: Download macOS x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos-x64
          path: dist/x64

      - name: Merge latest-mac.yml
        run: >-
          node scripts/merge-mac-update-info.mjs
          --out dist/latest-mac.yml
          --input dist/arm64/latest-mac-arm64
          --input dist/x64/latest-mac-x64

      # workflow_dispatch（无 tag）调试运行只产出合并文件，不碰 Release。
      - name: Attach macOS installers to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # 双 arch dmg/zip + blockmap + 合并后的 latest-mac.yml 一并挂到同一 Release，
          # softprops 是唯一上传通道（bundle.mjs --publish never）。
          files: |
            dist/arm64/Zodex-*-mac-arm64.dmg
            dist/arm64/Zodex-*-mac-arm64.dmg.blockmap
            dist/arm64/Zodex-*-mac-arm64.zip
            dist/arm64/Zodex-*-mac-arm64.zip.blockmap
            dist/x64/Zodex-*-mac-x64.dmg
            dist/x64/Zodex-*-mac-x64.dmg.blockmap
            dist/x64/Zodex-*-mac-x64.zip
            dist/x64/Zodex-*-mac-x64.zip.blockmap
            dist/latest-mac.yml
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # P5 W2：远程资产扁平上传集（4 份 manifest + 各平台组件 tarball，数量随平台变化，
  # 必须按 glob 上传）。prepare-prebuilds 内部串联 server bundle / agent bundle 构建。
  build-remote-assets:
    name: Build remote assets (flat GitHub Release set)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: release-remote-assets-${{ github.ref }}
      cancel-in-progress: false
    env:
      ZCODE_REMOTE_ASSET_FLAT_STAGING_DIR: ${{ github.workspace }}/remote-assets-flat-staging
      # GitHub runner 直连官方 Node dist 更稳；npmmirror 是国内默认值。
      ZCODE_NODE_DIST_MIRROR: https://nodejs.org/dist
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"

      - name: Build and stage flat remote assets
        run: pnpm prepare:remote-assets

      # workflow_dispatch（无 tag）调试运行只构建不碰 Release。
      - name: Attach remote assets to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: remote-assets-flat-staging/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
